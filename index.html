<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antibiotic Allergy — Bedside Tool</title>
<meta name="description" content="Cross-reactivity lookup and risk stratification based on the ESCMID 2026 antibiotic allergy guideline">
<meta name="theme-color" content="#080f1c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="抗菌薬アレルギー">
<style>
:root{
  --bg:#080f1c;
  --surface:#101c30;
  --surface-2:#16243c;
  --rule:#22334f;
  --rule-strong:#33486a;
  --ink:#e6edf8;
  --muted:#93a6c4;
  --accent:#5fb3d9;
  --accent-deep:#0d2036;
  --accent-soft:rgba(95,179,217,.14);
  --red:#ff6b6b;      --red-bg:rgba(255,107,107,.13);  --red-line:#ff6b6b;
  --amber:#f0b249;    --amber-bg:rgba(240,178,73,.13);
  --grey:#9fb0c9;     --grey-bg:rgba(159,176,201,.12);
  --green:#5bd39b;    --green-bg:rgba(91,211,155,.13);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-size:16px; line-height:1.65; -webkit-text-size-adjust:100%;
  font-feature-settings:"palt" 1;
}
html[lang="en"] body{font-feature-settings:normal}
.wrap{max-width:880px;margin:0 auto;padding:0 14px 72px}

/* ---------- header ---------- */
header{background:var(--accent-deep);border-bottom:1px solid var(--rule);padding:calc(13px + env(safe-area-inset-top,0px)) 0 0}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
header .wrap{padding-bottom:0}
.topline{display:flex;align-items:flex-start;gap:12px}
.topline div{min-width:0}
h1{font-size:17px;font-weight:600;margin:0 0 2px;letter-spacing:.01em;color:#eaf3fb}
header p{margin:0 0 12px;font-size:12.5px;color:#7d97b5;line-height:1.5}
.lang{margin-left:auto;flex:0 0 auto;display:flex;border:1px solid var(--rule-strong);border-radius:7px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;cursor:pointer;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--accent);color:#06111f}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;background:transparent;color:var(--muted);border:0;border-bottom:2px solid transparent;
  font:inherit;font-size:13.5px;padding:9px 13px;cursor:pointer;white-space:nowrap;
}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav button:focus-visible,.chip:focus-visible,select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- generic ---------- */
section[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:16px;margin:14px 0}
h2{font-size:16px;margin:22px 0 8px;font-weight:600}
h3{font-size:14.5px;margin:18px 0 6px;font-weight:600;color:var(--accent)}
p{margin:.5em 0}
.note{font-size:13px;color:var(--muted);line-height:1.7}
.note + .note{margin-top:.9em}
.note ul{margin:.35em 0 .6em;padding-left:1.15em}
.note li{margin:.3em 0}
.subhead{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 .2em}
/* guidance blocks under the cross-reactivity verdict */
.grule{margin:14px 0 0;padding:0 0 0 13px;border-left:2px solid var(--rule-strong)}
.grule h5{margin:0 0 5px;font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:.01em}
.grule ul{margin:0;padding-left:1.15em}
.grule li{margin:.32em 0;font-size:13px;color:var(--muted);line-height:1.7}
.gcaution{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);display:grid;gap:9px}
.gcaution div{position:relative;padding-left:20px;font-size:12.5px;color:var(--muted);line-height:1.7}
.gcaution div::before{content:"!";position:absolute;left:2px;top:0;color:var(--amber);font-weight:700}
.sep{height:1px;background:var(--rule);border:0;margin:16px 0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
select,input[type="text"]{
  width:100%;font:inherit;font-size:16px;padding:10px 11px;border:1px solid var(--rule-strong);
  border-radius:8px;background:var(--surface-2);color:var(--ink);appearance:none;
}
select{
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
option,optgroup{background:var(--surface-2);color:var(--ink)}
.btn{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--surface-2);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#06111f;border-color:var(--accent);font-weight:600}
.btn-primary:hover{background:#7cc4e4;color:#06111f}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
ul{margin:.4em 0;padding-left:1.25em}
li{margin:.25em 0}
a{color:var(--accent)}

/* ---------- cross-reactivity ---------- */
.pick{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.pick{grid-template-columns:1fr 1fr}}
.verdict{border-radius:10px;padding:14px 16px;margin:14px 0;border-left:4px solid;background:var(--surface-2)}
.verdict .head{font-size:17px;font-weight:600;margin:0 0 4px}
.verdict .sub{font-size:13.5px;margin:0;line-height:1.65;color:var(--ink)}
.v-R{background:var(--red-bg);border-color:var(--red)} .v-R .head{color:var(--red)}
.v-O{background:var(--amber-bg);border-color:var(--amber)} .v-O .head{color:var(--amber)}
.v-G{background:var(--grey-bg);border-color:var(--grey)} .v-G .head{color:var(--grey)}
.v-N{background:var(--green-bg);border-color:var(--green)} .v-N .head{color:var(--green)}
.v-K{background:var(--surface-2);border-color:var(--rule-strong)} .v-K .head{color:var(--ink)}

.group{margin:16px 0 0}
.group h4{font-size:13.5px;margin:0 0 7px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--ink)}
.swatch{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.s-R{background:var(--red)} .s-O{background:var(--amber)} .s-G{background:var(--grey)} .s-N{background:var(--green)}
.drugs{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:13.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--rule-strong);
  background:var(--surface-2);cursor:pointer;font-family:inherit;color:var(--ink)
}
.chip:hover{border-color:var(--accent)}
.chip .jp{color:var(--muted);font-size:12px;margin-left:5px}
.chip.c-R{background:var(--red-bg);border-color:rgba(255,107,107,.45)}
.chip.c-O{background:var(--amber-bg);border-color:rgba(240,178,73,.45)}
.chip.c-G{background:var(--grey-bg);border-color:rgba(159,176,201,.4)}
.chip.c-N{background:var(--green-bg);border-color:rgba(91,211,155,.35)}
.unavail{opacity:.55}
.legend{font-size:12.5px;color:var(--muted);display:grid;gap:6px;margin-top:6px}
.legend div{display:flex;align-items:center;gap:9px}

/* ---------- wizard ---------- */
.q{margin:0 0 8px;font-size:15px;font-weight:600}
.opts{display:grid;gap:8px;margin-bottom:6px}
.opt{
  text-align:left;font:inherit;font-size:14.5px;padding:11px 13px;border-radius:9px;
  border:1px solid var(--rule-strong);background:var(--surface-2);cursor:pointer;line-height:1.55;color:var(--ink)
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:11px}
.crumb span{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:2px 7px;margin:0 4px 4px 0;display:inline-block}
.result{border-radius:10px;padding:16px;border-left:4px solid}
.r-vlow{background:var(--green-bg);border-color:var(--green)} .r-vlow .tag{color:var(--green)}
.r-low{background:var(--accent-soft);border-color:var(--accent)} .r-low .tag{color:var(--accent)}
.r-high{background:var(--red-bg);border-color:var(--red)} .r-high .tag{color:var(--red)}
.result .tag{font-size:12.5px;font-weight:700;letter-spacing:.04em;margin:0 0 3px}
.result h3{margin:0 0 8px;font-size:17px;color:var(--ink)}

/* ---------- score ---------- */
.score-row{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px;cursor:pointer}
.score-row:last-of-type{border-bottom:0}
.score-row input{width:20px;height:20px;margin-top:2px;flex:0 0 auto;accent-color:var(--accent)}
.score-row .pts{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;padding-top:2px}
.total{display:flex;align-items:baseline;gap:12px;margin-top:12px;padding-top:12px;border-top:2px solid var(--rule-strong)}
.total b{font-size:32px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.total span{font-size:13.5px;color:var(--muted)}

/* ---------- checklist / timer ---------- */
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14.5px;cursor:pointer}
.check input{width:19px;height:19px;margin-top:2px;flex:0 0 auto;accent-color:var(--red)}
.timer{font-variant-numeric:tabular-nums;font-size:46px;font-weight:600;letter-spacing:.02em;margin:6px 0;color:var(--accent)}
ol.steps{padding-left:1.35em;margin:.4em 0}
ol.steps li{margin:.45em 0}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px}
code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:13px;color:var(--accent)}
.disclaimer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px;margin-top:26px;line-height:1.7}
@media (prefers-reduced-motion:no-preference){.verdict,.result{animation:in .18s ease-out}}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="topline">
      <div>
        <h1 id="hTitle"></h1>
        <p id="hSub"></p>
      </div>
      <div class="lang">
        <button data-lang="ja" aria-pressed="true">日本語</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <nav role="tablist" id="nav"></nav>
  </div>
</header>

<div class="wrap">
  <section id="cross"></section>
  <section id="risk" hidden></section>
  <section id="cdct" hidden></section>
  <section id="sev" hidden></section>
  <section id="rec" hidden></section>
  <section id="link" hidden></section>

   "<li><b>Penicillins</b>: ampicillin, sultamicillin</li>"+
   "<li><b>Oral cephalosporins</b>: cefdinir, cefcapene, cefditoren, cefteram (any other than cefaclor)</li>"+
   "<li><b>Injectable cephalosporins and cephamycins</b>: cefotiam, cefmetazole, flomoxef, cefminox, cefoperazone/sulbactam</li>"+
   "<li><b>Carbapenems</b>: doripenem, biapenem, tebipenem</li></ul>"+
   "<p class='note'>Judge these by the same principle — <b>R1/R2 side chain similarity</b> — and involve a specialist when the answer is not clear.</p>"+
   "<hr class='sep'>"+
   "<p class='subhead'>On ampicillin</p>"+
   "<p class='note'>Ampicillin does not appear in Table 3, so what follows is general knowledge rather than guideline content.<br>An aminopenicillin like amoxicillin, it shares its R1 side chain with cefalexin and cefaclor.<br>"+
   "Amino-cephalosporins carry the highest reported cross-reactivity in penicillin-allergic patients (16.45%; Picard 2019, cited by this guideline).</p>"},

 cd_proto_h:{ja:"投与プロトコル",en:"Dosing protocol"},
 cd_proto:{ja:"<h3>単回投与法</h3><p>被疑薬の常用量を 100% 投与（可能なら経口）。被疑薬が不明でペニシリンと推定される場合は <b>アモキシシリン 500 mg（成人）</b>。投与後 <b>60分以上</b> 観察。</p>"+
  "<h3>段階的投与法（BSACI 2022 の例）</h3><ol class='steps'><li>常用量の 10%（アモキシシリン 50 mg）→ 30分観察</li><li>常用量の 50%（アモキシシリン 250 mg）→ 30分観察</li><li>残量（アモキシシリン 200 mg）→ 60分観察</li></ol>"+
  "<p class='note'>どちらを使うかは施設のプロトコルに従います。多日間の負荷試験はルーチンには推奨されません（推奨 3.2）。</p>",
  en:"<h3>Single dose</h3><p>Give 100% of a full dose of the index antibiotic, orally where possible. If the culprit is unknown but probably a penicillin, use <b>amoxicillin 500 mg</b> for adults. Observe for <b>at least 60 minutes</b>.</p>"+
  "<h3>Graded dose (BSACI 2022 example)</h3><ol class='steps'><li>10% of a full dose (amoxicillin 50 mg) → observe 30 min</li><li>50% of a full dose (amoxicillin 250 mg) → observe 30 min</li><li>Remainder (amoxicillin 200 mg) → observe 60 min</li></ol>"+
  "<p class='note'>Which one you use follows local preference. Multiple-day challenge is not recommended as routine (recommendation 3.2).</p>"},
 cd_timer_h:{ja:"観察タイマー",en:"Observation timer"},

 cd_stop:{ja:"停止",en:"Stop"},
 cd_pr_h:{ja:"実施の原則（Table 4）",en:"Principles of the challenge (Table 4)"},
 cd_pr:{ja:["患者に説明し同意を得る。適応と禁忌を確認する。","バイタルサインが測定でき、アナフィラキシーを含むアレルギー反応に対応できる場所で行う。","単回投与法または段階的投与法を、施設の方針に従って選ぶ。","アナフィラキシーを疑う症状が出たら、施設プロトコル／国内のアナフィラキシー診療ガイドラインに沿って治療する。","最終投与後 1時間以上観察する。","帰宅後に症状が出た場合の対応を、書面で患者に渡す。","結果をかかりつけ医・他の医療者に伝える仕組みを作る。患者本人にも結果と意味を（できれば書面で）伝える。"],
        en:["Inform the patient and take consent; check suitability.","Perform it where vital signs can be measured and allergic reactions, including anaphylaxis, can be treated.","Choose single-dose or graded-dose according to local preference.","If symptoms consistent with anaphylaxis develop, treat per local protocol or national anaphylaxis guidance.","Observe for at least one hour after the last dose.","Give the patient written instructions on what to do if symptoms appear after they leave.","Have a system to tell the GP and other clinicians the result, and give the patient clear written information about what it means."]},

 /* ---- severity ---- */
 sv_h1:{ja:"重症（severe）",en:"Severe"},
 sv_1:{ja:"<p class='note'>症状による分類（WAO/EAACI）— 以下のいずれか。</p><ol class='steps'>"+
   "<li>皮膚／粘膜症状（全身性蕁麻疹、掻痒、紅潮、口唇・舌・口蓋垂の腫脹）の急性発症に加えて、<br>a. 呼吸器症状（呼吸困難、喘鳴・気管支攣縮、stridor、PEF低下、低酸素）<br>b. 血圧低下または臓器障害を示す症状（虚脱、失神、失禁）<br>のいずれかを伴う</li>"+
   "<li>既知または強く疑われるアレルゲン曝露後に、皮膚症状がなくても低血圧・気管支攣縮・喉頭症状が急性に出現</li>"+
   "<li>重症皮膚有害反応（SCAR）の danger sign<br>a. 小水疱・痂皮、灰紫色〜暗色の皮疹、有痛性／灼熱感のある皮膚・粘膜＋発熱・倦怠感、粘膜のびらん、皮膚剥離（SJS/TEN）<br>b. 膿疱を伴う皮疹（AGEP）<br>c. 紫斑（血管炎）<br>d. 皮膚外臓器障害を伴う斑・丘疹、体表 50% 超への進展、血算・肝腎の異常（DRESS）<br>e. 顔面浮腫、浮腫性・浸潤性の皮膚炎症、38.5℃ 以上の発熱（AGEP/DRESS）</li></ol>"+
   "<p class='note'>結果による分類（CIOMS）— 致死的／生命を脅かす、入院を要した、持続的な障害を残した、恒久的損傷を防ぐ介入を要した、先天異常を来した、のいずれか。</p>",
  en:"<p class='note'>By symptoms (WAO/EAACI) — any one of the following.</p><ol class='steps'>"+
   "<li>Acute onset of skin and/or mucosal involvement (generalised urticaria, pruritus, flushing, swollen lips, tongue or uvula) plus either<br>a. respiratory compromise (dyspnoea, wheeze or bronchospasm, stridor, reduced PEF, hypoxaemia), or<br>b. reduced blood pressure or symptoms of end-organ dysfunction (collapse, syncope, incontinence)</li>"+
   "<li>Acute hypotension, bronchospasm or laryngeal involvement after exposure to a known or highly probable allergen, even without skin signs</li>"+
   "<li>Danger signs for severe cutaneous adverse reactions<br>a. tiny vesicles or crusts, grey-violaceous or dusky lesions, painful or burning skin and mucosa with fever and malaise, haemorrhagic mucosal erosions, skin detachment (SJS/TEN)<br>b. exanthema with pustules (AGEP)<br>c. purpura (vasculitis)<br>d. macules and papules with non-cutaneous organ involvement, spread beyond 50% of body surface, deranged blood count or liver and kidney values (DRESS)<br>e. facial oedema, oedematous infiltrated skin inflammation, fever of 38.5°C or higher (AGEP/DRESS)</li></ol>"+
   "<p class='note'>By consequences (CIOMS) — fatal or life-threatening, causing hospitalisation, leaving persistent or significant disability, requiring intervention to prevent permanent damage, or causing congenital anomalies.</p>"},
 sv_h2:{ja:"非重症（nonsevere）",en:"Non-severe"},
 sv_2:{ja:"<ol class='steps'><li>単一臓器系の症状のみ<br>a. 皮膚：限局性蕁麻疹、紅斑・熱感、掻痒、口唇の違和感<br>b. 上気道：くしゃみ、鼻汁、鼻閉、咽頭掻痒、気管支攣縮によらない咳<br>c. 結膜：充血、掻痒、流涙</li>"+
   "<li>臓器障害を伴わない斑状丘疹状皮疹</li><li>その他：悪心、金属味、消化器症状（腹部疝痛、反復する嘔吐）</li></ol>"+
   "<p class='note'><b>蕁麻疹の扱い：</b>急性蕁麻疹は通常、曝露後 1時間以内に出現し 1日以内に消退します。孤立性・限局性の蕁麻疹を非重症とするガイドラインもありますが、本ガイドラインのパネルは安全側に倒して <b>蕁麻疹は重症度によらず高リスク</b>に分類しています（エビデンスは限定的と明記）。臨床的に特定の抗菌薬が必要な場合は、多職種で議論のうえ負荷試験を検討できます。</p>",
  en:"<ol class='steps'><li>Symptoms from one organ system only<br>a. skin: localised urticaria, erythema and warmth, pruritus, tingling or itching of the lips<br>b. upper respiratory: sneezing, rhinorrhoea, nasal itch or congestion, throat clearing, cough not due to bronchospasm<br>c. conjunctival: erythema, pruritus, tearing</li>"+
   "<li>Maculopapular exanthema without organ involvement</li><li>Other: nausea, metallic taste, gastrointestinal symptoms such as cramping abdominal pain or repetitive vomiting</li></ol>"+
   "<p class='note'><b>On urticaria:</b> acute urticaria usually appears within an hour of exposure and settles within a day. Some guidelines call isolated or focal urticaria non-severe, but this panel deliberately classifies <b>urticaria as high risk regardless of severity</b>, noting the evidence is limited. Where a specific antibiotic is clinically needed, a challenge can be considered after multidisciplinary discussion.</p>"},

function guidance(ci,ti){
  const a=DRUGS[ci].cls, b=ti>=0?DRUGS[ti].cls:null, keys=[];
  if(a==="pen"){
    if(b==="pen"||b===null) keys.push("pp");
    if(b==="ceph"||b===null) keys.push("pc");
    if(ti===7) keys.push("cefaz");
    if(b==="carb"||b==="mono"||b===null) keys.push("pcarb");
  } else if(a==="ceph"){
    if(b==="ceph"||b===null) keys.push("cc");
    if(b==="carb"||b===null) keys.push("ccarb");
    if(b==="mono"||b===null) keys.push("cmono");
    if(b==="pen") keys.push("cp");
  } else keys.push("none");
  return keys.map(k=>{const g=GUIDE[k];
    return '<div class="grule"><h5>'+g.t[lang]+"</h5><ul>"+g.li.map(x=>"<li>"+x[lang]+"</li>").join("")+"</ul></div>";
  }).join("")+'<div class="gcaution">'+CAUTION.map(c=>"<div>"+c[lang]+"</div>").join("")+"</div>";
}

/* ---------- cross tab ---------- */
function buildCross(){
  const el=document.getElementById("cross");
  el.innerHTML=

   '<div><label for="culprit">'+t("c_culprit")+'</label><select id="culprit"></select></div>'+
   '<div><label for="target">'+t("c_target")+'</label><select id="target"></select></div>'+
   '</div><div id="verdict"></div><div id="guide" class="note"></div></div>'+
   '<div class="card"><div id="lists"></div><hr class="sep"><div class="legend">'+
   ["R","O","G","N"].map((c,i)=>'<div><span class="swatch s-'+c+'"></span>'+t("c_legend")[i]+'</div>').join('')+
   '</div><p class="note" style="margin-top:11px">'+t("c_src")+'</p></div>'+
   '<div class="card"><h3 style="margin-top:0">'+t("c_missing_h")+'</h3>'+t("c_missing")+'</div>';

  const selC=document.getElementById("culprit"), selT=document.getElementById("target");
  const opt=(v,label)=>{const o=document.createElement("option");o.value=v;o.textContent=label;return o;};
  selT.appendChild(opt(-1,t("c_all")));
  [["pen",0],["ceph",1],["carb",2],["mono",3]].forEach(([c,gi])=>{
    [selC,selT].forEach(sel=>{
      const g=document.createElement("optgroup"); g.label=t("c_groups")[gi];
      DRUGS.forEach((d,i)=>{ if(d.cls!==c) return;
        const main=lang==="ja"?d.jp+" ("+d.en+(d.ab?" / "+d.ab:"")+")":d.en+(d.ab?" ("+d.ab+")":"");
        g.appendChild(opt(i,main+(d.jpAvail?"":t("c_notavail"))));
      });
      sel.appendChild(g);
    });
  });
  selC.value=String(st.ci); selT.value=String(st.ti);
  selC.onchange=()=>{st.ci=+selC.value;renderCross();};
  selT.onchange=()=>{st.ti=+selT.value;renderCross();};
  renderCross();
}
function renderCross(){
  const ci=st.ci, ti=st.ti, vd=document.getElementById("verdict");
  if(ti>=0){
    const c=M[ci][ti], info=CODE[c];
    vd.innerHTML='<div class="verdict v-'+c+'"><p class="head">'+info.head[lang]+'</p><p class="sub">'+
      t("c_pair")(dn(ci),dn(ti),info.label[lang])+" "+info.sub[lang]+'</p></div>';
  } else vd.innerHTML="";
  document.getElementById("guide").innerHTML=guidance(ci,ti);

  let html='<h3 style="margin-top:0">'+t("c_head")(dn(ci))+'</h3>';
  ["R","O","G","N"].forEach((code,i)=>{
    const items=DRUGS.map((d,j)=>[d,j]).filter(([d,j])=>M[ci][j]===code);
    if(!items.length) return;
    html+='<div class="group"><h4><span class="swatch s-'+code+'"></span>'+t("c_legend")[i]+"（"+items.length+"）</h4><div class=\"drugs\">"+
      items.map(([d,j])=>'<button class="chip c-'+code+(d.jpAvail?"":" unavail")+'" data-i="'+j+'">'+dn(j)+
        (dsub(j)?'<span class="jp">'+dsub(j)+"</span>":"")+"</button>").join("")+"</div></div>";
  });
  document.getElementById("lists").innerHTML=html;
  document.querySelectorAll("#lists .chip").forEach(b=>b.onclick=()=>{
    st.ti=+b.dataset.i; document.getElementById("target").value=b.dataset.i;
    renderCross(); window.scrollTo({top:0,behavior:"smooth"});
  });
}

function drawWz(){
  const cr=document.getElementById("crumbs");
  cr.innerHTML=st.path.length?st.path.map(p=>"<span>"+p+"</span>").join(""):
    '<span style="border:0;background:none;padding:0">'+t("r_hint")+"</span>";
  const el=document.getElementById("wizard");
  if(RES[st.node]){
    const r=RES[st.node];
    el.innerHTML='<div class="result r-'+r.k+'"><p class="tag">'+r.t[lang]+'</p><h3>'+r.h[lang]+
      '</h3><p style="margin:0;font-size:14.5px;line-height:1.7">'+r.b[lang]+"</p></div>";
    return;
  }
  const n=WZ[st.node];
  el.innerHTML='<p class="q">'+n.q[lang]+'</p><div class="opts">'+n.o.map((o,i)=>
    '<button class="opt" data-i="'+i+'">'+o[0][lang]+(o[1][lang]?"<small>"+o[1][lang]+"</small>":"")+"</button>").join("")+"</div>";
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, o=n.o[i], k=st.node;
    if(WZ[k].set) Object.assign(st.ans,WZ[k].set(o,i));
    st.path.push({k:k,i:i});
    const NBL={time:"R_nbl_low",R_low_challenge:"R_nbl_low",R_high_imm:"R_nbl_ref",R_high_del:"R_nbl_high",R_urt:"R_nbl_ref"};
    st.node=(st.ans.bl===false&&NBL[o[2]])?NBL[o[2]]:o[2];
    drawWz();
  });
}
/* crumbs need to survive a language switch, so store {node,index} and render on the fly */
function crumbLabel(p){
  const s=WZ[p.k].o[p.i][0][lang].split("／")[0].split(" (")[0].split("（")[0].trim();
  const n=lang==="ja"?14:26;
  return s.length>n?s.slice(0,n)+"…":s;

/* ---------- PEN-FAST ---------- */
const PF_PTS=[0,2,2,1];
function buildPenfast(){
  const el=document.getElementById("penfast");
  el.innerHTML=t("pf_items").map((s,i)=>
    '<label class="score-row"><input type="checkbox" data-i="'+i+'"'+(i===0?" checked disabled":(st.pf[i]?" checked":""))+
    '><span>'+s+'</span><span class="pts">'+t("pf_pts")(PF_PTS[i])+"</span></label>").join("")+
    '<div class="total"><b id="pfN">0</b><span id="pfT"></span></div>';
  const upd=()=>{
    let s=0;
    el.querySelectorAll("input:not(:disabled)").forEach(c=>{const i=+c.dataset.i;st.pf[i]=c.checked;if(c.checked)s+=PF_PTS[i];});
    document.getElementById("pfN").textContent=s;

}

/* ---------- CDCT ---------- */
let tIv=null,tEnd=null;
function buildCdct(){
  if(tIv){clearInterval(tIv);tIv=null;}
  document.getElementById("cdct").innerHTML=
   '<div class="card"><h2 style="margin-top:0">'+t("cd_contra_h")+'</h2><p class="note">'+t("cd_contra_note")+'</p>'+
   '<div id="contra">'+t("cd_contra").map((c,i)=>'<label class="check"><input type="checkbox" data-i="'+i+'"'+(st.co[i]?" checked":"")+"><span>"+c+"</span></label>").join("")+
   '</div><div id="contraOut"></div></div>'+
   '<div class="card"><h2 style="margin-top:0">'+t("cd_proto_h")+'</h2>'+t("cd_proto")+
   '<hr class="sep"><h3>'+t("cd_timer_h")+'</h3><div class="timer" id="clock">--:--</div>'+
   '<div class="btn-row"><button class="btn" data-min="30">'+t("cd_min")(30)+'</button>'+
   '<button class="btn" data-min="60">'+t("cd_min")(60)+'</button>'+
   '<button class="btn" id="tStop">'+t("cd_stop")+'</button></div>'+
   '<p class="note">'+t("cd_timer_note")+'</p></div>'+
   '<div class="card"><h2 style="margin-top:0">'+t("cd_pr_h")+'</h2><ol class="steps">'+
   t("cd_pr").map(s=>"<li>"+s+"</li>").join("")+"</ol></div>";

  const box=document.getElementById("contra"), out=document.getElementById("contraOut");
  const upd=()=>{
    let n=0; box.querySelectorAll("input").forEach(c=>{st.co[+c.dataset.i]=c.checked;if(c.checked)n++;});
    out.innerHTML = n
      ? '<div class="verdict v-R" style="margin-bottom:0"><p class="head">'+t("cd_ng")[0]+'</p><p class="sub">'+t("cd_ng")[1](n)+"</p></div>"
      : '<div class="verdict v-N" style="margin-bottom:0"><p class="head">'+t("cd_ok")[0]+'</p><p class="sub">'+t("cd_ok")[1]+"</p></div>";
  };
  box.querySelectorAll("input").forEach(c=>c.onchange=upd); upd();

  const disp=document.getElementById("clock");
  const tick=()=>{
    const s=Math.max(0,Math.round((tEnd-Date.now())/1000));
    disp.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    if(s<=0){clearInterval(tIv);tIv=null;tEnd=null;beep();disp.style.color="var(--red)";}
  };
  const beep=()=>{try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();a.close();},700);}catch(e){}};
  document.querySelectorAll("#cdct [data-min]").forEach(b=>b.onclick=()=>{
    tEnd=Date.now()+(+b.dataset.min)*60000; disp.style.color="";
    if(tIv)clearInterval(tIv); tIv=setInterval(tick,250); tick();
  });
  document.getElementById("tStop").onclick=()=>{if(tIv)clearInterval(tIv);tIv=null;tEnd=null;disp.textContent="--:--";disp.style.color="";};
  if(tEnd){tIv=setInterval(tick,250);tick();}
}

const st={ci:0,ti:-1,node:"start",path:[],ans:{},pf:[true,false,false,false],co:[false,false,false,false,false,false,false],q:""};

function buildAll(){
  document.documentElement.lang=lang;
  document.getElementById("hTitle").textContent=t("title");
  document.getElementById("hSub").textContent=t("sub");
  document.getElementById("disc").textContent=t("disc");
  document.getElementById("nav").innerHTML=t("nav").map((n,i)=>
    '<button role="tab" data-tab="'+TABS[i]+'" aria-selected="'+(TABS[i]===active)+'">'+n+"</button>").join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{
    active=b.dataset.tab;
    document.querySelectorAll("#nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
    TABS.forEach(id=>document.getElementById(id).hidden=(id!==active));
    window.scrollTo({top:0});
  });
  buildCross(); buildRisk(); buildCdct(); buildSev(); buildRec(); buildLink();
  TABS.forEach(id=>document.getElementById(id).hidden=(id!==active));
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  if(lang===b.dataset.lang) return;
  lang=b.dataset.lang;
  document.querySelectorAll(".lang button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  buildAll();
});
/* crumbs render through crumbLabel so they follow the language */
const _drawWz=drawWz;
drawWz=function(){
  _drawWz();
  const cr=document.getElementById("crumbs");
  if(st.path.length) cr.innerHTML=st.path.map(p=>"<span>"+crumbLabel(p)+"</span>").join("");
};
buildAll();

/* オフラインで開けるようにする。https 配信のときだけ有効になります */
if("serviceWorker" in navigator){
  /* updateViaCache:"none" は sw.js 自体を HTTP キャッシュから取らせないための指定。
     これがないと配信側のキャッシュで古い Service Worker が残り続けることがあります */
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js",{scope:"./",updateViaCache:"none"})
      .then(r=>r.update())
      .catch(()=>{});
  });
}
</script>
